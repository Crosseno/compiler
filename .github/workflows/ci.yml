name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dependencies: [lowest, current]
    steps:
      - uses: actions/checkout@v5
        with:
          path: compiler
      - uses: actions/checkout@v5
        with:
          repository: Crosseno/core
          path: core
      - uses: actions/checkout@v5
        with:
          repository: Crosseno/lexicon
          path: lexicon
      - uses: actions/checkout@v5
        with:
          repository: Crosseno/lexicon-sqlite
          path: lexicon-sqlite
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          working-directory: compiler
      - run: composer check
        working-directory: compiler
